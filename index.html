<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>K & K chat 💞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1c1322;
    --bg-mid:#271a2e;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.09);
    --pink:#ffb3c6;
    --lav:#d6b8ff;
    --mint:#b9f3df;
    --peach:#ffd3a0;
    --blue:#1100FF;
    --red:#FF6161;
    --text:#fbeef2;
    --text-dim:#c9b8ce;
  }
  *{box-sizing:border-box;}
  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,179,198,0.18), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(214,184,255,0.16), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(185,243,223,0.1), transparent 50%),
      linear-gradient(#1c1322, #110b16);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    background: var(--panel);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
    text-align: center;
    padding: 0.85em;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.4em;
    letter-spacing: 0.3px;
    color: var(--pink);
    text-shadow: 0 0 16px rgba(129, 228, 251, 0.4);
  }
  header .heart { display:inline-block; animation: pulseHeart 1.6s ease-in-out infinite; }
  @keyframes pulseHeart { 0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.2) rotate(-6deg);} }

  #pin-screen, #login {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: var(--text);
    position: relative;
    overflow-y: auto;
    gap: 0.5em;
    text-align: center;
    padding: 2em 1.2em;
  }
  #pin-screen{ display:flex; }
  #login{ display:none; }

  #pin-screen p, #login label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.25em;
    color: var(--pink);
    margin-bottom: 0.5em;
  }

  #pin-inputs { display: flex; gap: 0.7em; }
  .pin-digit {
    width: 48px; height: 58px;
    text-align: center;
    font-size: 1.6em;
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    outline: none;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 0 16px rgba(0, 195, 255, 0.53);
    -webkit-text-security: disc;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .pin-digit:focus { border-color: var(--pink); box-shadow: 0 0 20px rgba(44, 7, 255, 0.6); }
  .pin-digit.error { animation: shake 0.3s; box-shadow: 0 0 14px rgba(255, 0, 0, 0.71); border-color:#ff6b6b; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  #login::before {
    content:"";
    position:absolute; inset:0;
    background-image: url("YOUR_IMAGE_URL_HERE.jpg");
    background-size:cover; background-position:center;
    opacity:0.6; z-index:0;
  }
  #login > * { position:relative; z-index:1; }

  #userSelect {
    padding: 0.85em 1.2em;
    margin: 0.5em 0;
    border-radius: 25px;
    border: 1px solid var(--panel-border);
    outline: none;
    background: var(--bg-mid);
    color: var(--lav);
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1em;
    box-shadow: 0 0 14px rgba(214,184,255,0.3);
    cursor: pointer;
    transition: 0.3s;
  }
  #userSelect:hover { background:#32223b; }

  #login button.login {
    display: inline-flex; align-items:center; justify-content:center;
    padding: 12px 30px; margin-top: 0.9em; min-width: 150px; height: 46px;
    border-radius: 30px; border: none;
    background: linear-gradient(135deg, var(--blue), var(--red));
    color: #241627; font-family:'Fredoka',sans-serif; font-size: 1rem; font-weight: 600;
    cursor: pointer; box-shadow: 0 0 18px rgba(0, 255, 247, 0.5); letter-spacing:0.3px;
    transition: all 0.25s ease;
  }
  #login button.login:hover { transform: translateY(-2px) scale(1.05) rotate(-1deg); box-shadow: 0 0 26px rgba(118, 255, 250, 0.5); }
  #login button.login:active { transform: scale(0.96); }

  #thought-card {
    margin-top: 1.6em;
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 1em 1.1em;
  }
  #thought-card p.label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1em;
    color: var(--mint);
    margin: 0 0 0.6em;
  }
  #thoughtInput {
    width: 100%; resize: none; min-height: 54px;
    padding: 0.7em 0.9em; border-radius: 14px; border: 1px solid var(--panel-border);
    background: var(--bg-mid); color: var(--text); font-family:'Quicksand',sans-serif;
    font-size: 0.95em; outline: none;
  }
  #thought-card .send-thought {
    margin-top: 0.6em; width:100%; height:40px; border-radius:16px; border:none;
    background: linear-gradient(135deg, var(--mint), var(--lav));
    color:#201529; font-family:'Fredoka',sans-serif; font-weight:600; font-size:0.9em;
    cursor:pointer; box-shadow: 0 0 14px rgba(185,243,223,0.4);
  }
  #thoughtsList {
    margin-top: 0.8em; max-height: 140px; overflow-y: auto; text-align:left;
    display:flex; flex-direction:column; gap:0.5em;
    scrollbar-width: thin;
    scrollbar-color: rgba(185,243,223,0.4) transparent;
  }
  .thought-item {
    background: rgba(255,255,255,0.04); border-radius: 12px; padding: 0.5em 0.7em;
    font-size: 0.82em; line-height:1.3;
  }
  .thought-item .t-sender { color: var(--pink); font-weight:600; margin-right:0.3em; }
  .thought-item .t-time { display:block; opacity:0.5; font-size:0.75em; margin-top:0.15em; }

  #chat { display:none; position:relative; flex:1; flex-direction:column; min-height:0; }

  #chat-box {
    flex: 1; overflow-y: auto; padding: 1em;
    display: flex; flex-direction: column; gap: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 110, 110, 0.4) transparent;
  }
  #chat-box::-webkit-scrollbar,
  #thoughtsList::-webkit-scrollbar,
  #gif-panel::-webkit-scrollbar,
  #pin-screen::-webkit-scrollbar {
    width: 6px;
  }
  #chat-box::-webkit-scrollbar-track,
  #thoughtsList::-webkit-scrollbar-track,
  #gif-panel::-webkit-scrollbar-track,
  #pin-screen::-webkit-scrollbar-track {
    background: transparent;
  }
  #chat-box::-webkit-scrollbar-thumb,
  #thoughtsList::-webkit-scrollbar-thumb,
  #gif-panel::-webkit-scrollbar-thumb,
  #pin-screen::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--pink), var(--lav));
    border-radius: 10px;
  }

  #gif-panel {
    position: absolute; bottom: 68px; left: 0; right: 0;
    background: var(--bg-mid); padding: 10px;
    border-top: 1px solid var(--panel-border);
    max-height: 200px; overflow-y: auto; z-index: 1000;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }

  #gif-search {
    width:100%; padding:8px 14px; border-radius:20px; border:none; outline:none;
    background:#241a2b; color:var(--text); margin-bottom:10px; font-family:'Quicksand',sans-serif;
  }
  #gif-results { display:grid; grid-template-columns: repeat(auto-fill, 100px); gap:8px; }
  #gif-results img { width:100px; border-radius:10px; cursor:pointer; transition: transform 0.2s; }
  #gif-results img:hover { transform: scale(1.08); }

  .message-row { display:flex; align-items:flex-end; gap:0.5em; margin:0.45em 0.8em; max-width:78%; }
  .message-row.sent { align-self:flex-end; flex-direction:row-reverse; }
  .message-row.received { align-self:flex-start; }

  .bubble-wrap { position:relative; display:flex; flex-direction:column; min-width:0; }
  .message img.gif-message.photo-message { max-width: 240px; width: 100%; min-height: 80px; background: rgba(255,255,255,0.05); }
  .full-link { display:inline-block; margin-top:0.35em; font-size:0.72em; color:var(--mint); text-decoration:none; opacity:0.85; }
  .msg-actions { display:flex; gap:4px; align-self:center; flex-shrink:0; }
  #reply-bar {
    display:none; align-items:center; gap:0.6em; padding:0.45em 0.9em;
    background:var(--bg-mid); border-top:1px solid var(--panel-border);
  }
  #reply-bar .rb-text { flex:1; min-width:0; font-size:0.82em; border-left:3px solid var(--pink); padding-left:0.6em; }
  #reply-bar .rb-text b { display:block; color:var(--pink); font-weight:600; }
  #reply-bar .rb-text span { display:block; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #reply-bar .rb-x { cursor:pointer; opacity:0.7; padding:0.2em 0.5em; }
  #chat.replying .typing-pop { bottom:122px; }
  #chat.replying #gif-panel { bottom:122px; }
  .reply-quote {
    border-left:3px solid var(--pink); background:rgba(255,255,255,0.07);
    border-radius:8px; padding:0.3em 0.55em; margin-bottom:0.35em; cursor:pointer; max-width:100%;
  }
  .reply-quote .rq-name { font-size:0.72em; font-weight:600; color:var(--pink); }
  .reply-quote .rq-text { font-size:0.82em; opacity:0.85; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .message-row.flash .message { animation: flashMsg 1.4s ease; }
  @keyframes flashMsg { 0%,100%{box-shadow:none;} 30%{box-shadow:0 0 0 3px rgba(255,179,198,0.85), 0 0 22px rgba(255,179,198,0.7);} }

  /* /kiss animation */
  #love-overlay {
    position:fixed; inset:0; z-index:3000; pointer-events:none; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 45%, rgba(255,120,170,0.32), rgba(10,5,15,0.8));
    animation: loveFade 4.4s ease forwards;
  }
  @keyframes loveFade { 0%{opacity:0;} 8%{opacity:1;} 90%{opacity:1;} 100%{opacity:0;} }
  .lovers { position:relative; display:flex; align-items:flex-end; justify-content:center; height:min(34vh, 290px); }
  .lover { height:100%; width:auto; filter:drop-shadow(0 8px 18px rgba(0,0,0,0.5)); }
  .lover.boy { z-index:1; animation: boyMove 4.4s ease-in-out forwards; }
  .lover.girl { z-index:2; margin-left:-8%; animation: girlMove 4.4s ease-in-out forwards; }
  @keyframes boyMove {
    0%   { transform: translateX(-90vw) rotate(-8deg); }
    24%  { transform: translateX(0) rotate(0deg); }
    36%  { transform: translateX(7%) rotate(3deg) scale(1.07); }
    44%  { transform: translateX(5%) rotate(2deg) scale(1.02); }
    52%  { transform: translateX(8%) rotate(7deg) scale(1.05); }
    76%  { transform: translateX(8%) rotate(7deg) scale(1.05); }
    100% { transform: translateX(-90vw) rotate(-8deg); }
  }
  @keyframes girlMove {
    0%   { transform: translateX(90vw) rotate(8deg); }
    24%  { transform: translateX(0) rotate(0deg); }
    36%  { transform: translateX(-7%) rotate(-3deg) scale(1.07); }
    44%  { transform: translateX(-5%) rotate(-2deg) scale(1.02); }
    52%  { transform: translateX(-8%) rotate(-7deg) scale(1.05); }
    76%  { transform: translateX(-8%) rotate(-7deg) scale(1.05); }
    100% { transform: translateX(90vw) rotate(8deg); }
  }
  .kiss-pop { position:absolute; left:50%; top:14%; margin-left:-0.5em; font-size:4rem; line-height:1; opacity:0; z-index:5; animation: kissPop 4.4s ease forwards; }
  @keyframes kissPop {
    0%,50% { transform:scale(0); opacity:0; }
    56% { transform:scale(1.7) rotate(-8deg); opacity:1; }
    66% { transform:scale(1.2) rotate(6deg); opacity:1; }
    80% { transform:translateY(-30px) scale(1.3); opacity:1; }
    90%,100% { transform:translateY(-70px) scale(0.9); opacity:0; }
  }
  .love-caption { margin-top:1em; font-family:'Fredoka',sans-serif; font-size:1.15em; color:var(--pink); text-shadow:0 0 14px rgba(255,179,198,0.6); opacity:0; animation: captionIn 4.4s ease forwards; }
  @keyframes captionIn { 0%,30%{opacity:0; transform:translateY(8px);} 45%,85%{opacity:1; transform:translateY(0);} 100%{opacity:0;} }
  .love-heart { position:absolute; left:50%; top:30%; font-size:1.6rem; opacity:0; z-index:4; animation: loveHeart 2.2s ease-out forwards; }
  @keyframes loveHeart {
    0% { transform:translate(0,0) scale(0.3) rotate(0deg); opacity:0; }
    15% { opacity:1; }
    100% { transform:translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity:0; }
  }
  /* single emoji = big */
  .message.emoji-only { background:transparent !important; border-color:transparent; backdrop-filter:none; }
  .big-emoji { font-size:3.2rem; line-height:1.1; text-align:center; }

  /* watch together */
  .watch-dock { display:none; flex-direction:column; flex-shrink:0; background:#0b070f; border-bottom:1px solid var(--panel-border); }
  .wd-bar { display:flex; align-items:center; gap:0.4em; padding:0.25em 0.6em; font-size:0.8em; color:var(--text-dim); }
  .wd-title { flex:1; }
  .wd-btn { cursor:pointer; padding:0.1em 0.5em; border-radius:10px; background:rgba(255,255,255,0.1); user-select:none; }
  .wd-video { align-self:center; width:auto; max-width:100%; height:min(40vh, 56.25vw); aspect-ratio:16/9; background:#000; }
  .wd-video iframe, .wd-video .mock-yt { width:100%; height:100%; display:block; }
  .watch-dock.mini {
    position:fixed; top:74px; right:8px; width:176px; z-index:2500;
    border:1px solid var(--panel-border); border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.55);
  }
  .watch-dock.mini .wd-title { display:none; }
  .watch-dock.mini .wd-bar { justify-content:flex-end; padding:0.2em 0.3em; }
  .watch-dock.mini .wd-video { height:99px; width:176px; }

  /* full emoji sheet for reactions */
  #emoji-backdrop { position:fixed; inset:0; z-index:3500; background:rgba(0,0,0,0.4); display:flex; align-items:flex-end; justify-content:center; }
  #emoji-sheet {
    width:100%; max-width:520px; max-height:55vh; display:flex; flex-direction:column;
    background:var(--bg-mid); border:1px solid var(--panel-border); border-bottom:none;
    border-radius:22px 22px 0 0; padding:0.7em 0.8em calc(0.8em + env(safe-area-inset-bottom, 0px));
    animation: sheetUp .22s ease;
  }
  @keyframes sheetUp { from{transform:translateY(40px);opacity:0;} to{transform:translateY(0);opacity:1;} }
  .es-head { display:flex; align-items:center; gap:0.5em; margin-bottom:0.5em; }
  .es-x { cursor:pointer; opacity:0.7; padding:0.3em 0.5em; }
  .es-tabs { display:flex; gap:0.3em; margin-bottom:0.4em; }
  .es-tabs span { font-size:1.25em; padding:0.2em 0.5em; border-radius:12px; cursor:pointer; opacity:0.55; user-select:none; }
  .es-tabs span.on { opacity:1; background:rgba(255,255,255,0.1); }
  .es-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(40px, 1fr)); gap:2px; overflow-y:auto; }
  .es-item { font-size:1.55em; text-align:center; padding:0.15em; cursor:pointer; border-radius:10px; user-select:none; }
  .es-item:hover { background:rgba(255,255,255,0.1); }
  .reaction-picker span.pick-more {
    font-size:1.1em; font-weight:700; width:26px; height:26px; border-radius:50%; align-self:center;
    background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center;
  }
  /* /emoji wall */
  .emoji-wall { position:fixed; inset:0; z-index:2900; pointer-events:none; overflow:hidden; }
  .emoji-rise { position:absolute; bottom:-4rem; margin-left:-0.5em; opacity:0; animation: emojiRise 3s ease-in both; }
  @keyframes emojiRise {
    0%   { transform: translate(0, 0) scale(0.6) rotate(0deg); opacity:0; }
    12%  { opacity:1; }
    80%  { opacity:1; }
    100% { transform: translate(var(--sway), -118vh) scale(1.15) rotate(var(--rot)); opacity:0; }
  }
  .typing-pop {
    position:absolute; left:12px; bottom:72px; display:none; align-items:center; gap:0.5em;
    padding:0.35em 0.85em 0.35em 0.4em; background:var(--bg-mid);
    border:1px solid var(--panel-border); border-radius:22px; font-size:0.82em;
    color:var(--text-dim); box-shadow:0 6px 20px rgba(0,0,0,0.45); z-index:900;
    animation: popIn .2s ease;
  }
  .typing-pop .avatar.mini { width:26px; height:26px; min-width:26px; padding:2px; animation:none; box-shadow:none; }
  .typing-pop .avatar.mini .emoji-fallback { font-size:0.8em; }
  .typing-pop .dots i {
    display:inline-block; width:5px; height:5px; margin-left:3px; border-radius:50%;
    background:var(--pink); animation: bounceDot 1.1s infinite ease-in-out;
  }
  .typing-pop .dots i:nth-child(2) { animation-delay:.15s; }
  .typing-pop .dots i:nth-child(3) { animation-delay:.3s; }
  @keyframes bounceDot { 0%,60%,100%{transform:translateY(0);opacity:.5;} 30%{transform:translateY(-4px);opacity:1;} }
  .toast {
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:var(--bg-mid); border:1px solid var(--panel-border); color:var(--text);
    padding:0.5em 1.1em; border-radius:20px; font-size:0.9em; z-index:2000;
    box-shadow:0 6px 20px rgba(0,0,0,0.45); animation: popIn .2s ease;
  }
  .message { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .react-trigger {
    align-self:center; flex-shrink:0; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:0.85em;
    cursor:pointer; opacity:0.45; background:var(--panel); border:1px solid var(--panel-border);
    user-select:none; transition: opacity .2s, transform .2s;
  }
  .react-trigger:hover { opacity:1; transform:scale(1.12); }
  .reaction-picker {
    position:absolute; bottom:calc(100% + 6px); display:flex; gap:4px; padding:6px 10px;
    background:var(--bg-mid); border:1px solid var(--panel-border); border-radius:22px;
    box-shadow:0 6px 20px rgba(0,0,0,0.45); z-index:50; animation: popIn .18s ease;
  }
  .reaction-picker.below { bottom:auto; top:calc(100% + 6px); }
  .sent .reaction-picker { right:0; }
  .received .reaction-picker { left:0; }
  .reaction-picker span { font-size:1.35em; cursor:pointer; transition: transform .15s; user-select:none; }
  .reaction-picker span:hover { transform: scale(1.35) translateY(-2px); }
  @keyframes popIn { from{transform:scale(.7);opacity:0;} to{transform:scale(1);opacity:1;} }
  .reactions { display:flex; gap:4px; flex-wrap:wrap; margin-top:-4px; }
  .reactions:not(:empty) { margin-bottom:4px; }
  .sent .reactions { justify-content:flex-end; padding-right:8px; }
  .received .reactions { padding-left:8px; }
  .reaction-chip {
    font-size:0.8em; background:var(--bg-mid); border:1px solid var(--panel-border);
    border-radius:12px; padding:1px 7px; cursor:pointer; user-select:none;
  }
  .reaction-chip.mine { border-color:var(--pink); background:rgba(255,179,198,0.2); }

  .avatar {
    width:42px; height:42px; min-width:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.15em; flex-shrink:0;
    padding:3px;
    box-shadow:0 0 14px rgba(121, 234, 253, 0.45);
    animation: floatAvatar 3.2s ease-in-out infinite;
  }
  .avatar.avatar-a { background: linear-gradient(135deg, var(--red), var(--blue)); }
  .avatar.avatar-b { background: linear-gradient(135deg, var(--blue), var(--red)); }
  .avatar img {
    width:100%; height:100%; border-radius:50%;
    object-fit: cover;
    border: 2px solid var(--bg-deep);
    display:block;
  }
  .avatar .emoji-fallback {
    width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg-mid);
  }
  @keyframes floatAvatar { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  .message {
    padding: 0.65em 0.9em;
    border-radius: 18px;
    font-size: 0.95em;
    display: flex; flex-direction: column;
    white-space: normal; word-break: break-word; overflow-wrap: anywhere;
    border: 1px solid var(--panel-border);
  }
  .sent .message {
    background: linear-gradient(135deg, rgba(106, 238, 255, 0.62), rgba(40, 4, 157, 0.18));
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .received .message {
    background: var(--panel);
    backdrop-filter: blur(6px);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

<body>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getDatabase, ref, push, set, remove, onValue, onDisconnect, onChildAdded, onChildRemoved, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBeewPIldcE5h4bP1mAzkk4PLSFY6AjE1c",
    authDomain: "chat-v2626.firebaseapp.com",
    databaseURL: "https://chat-v2626-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "chat-v2626",
    storageBucket: "chat-v2626.firebasestorage.app",
    messagingSenderId: "403392475876",
    appId: "1:403392475876:web:838695d5114c330a08f2f1"
  };

  // --- Google Drive photo storage (see setup steps) ---
  // Paste your Apps Script "Web app" URL and the same secret word you put in the script.
  // Leave DRIVE_URL empty to keep sending smaller photos through the database instead.
  const DRIVE_URL = "https://script.google.com/macros/s/AKfycbzibLhRlUeONslgtgVcot5DtIHw9mPLXfFwf4wkR8BFUJInQoOaPPF_JXVoNj3NrSyWfQ/exec";
  const DRIVE_SECRET = "KproDrive";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let myName = null;
  const chatBox = document.getElementById("chat-box");

  // --- avatars: photo in a gradient-ring frame, with emoji fallback ---
  // Set img to your own photo URL. Leave it as "" to keep the emoji fallback.
  const AVATARS = {
    Kartu: { img: "image (1).png", emoji: "😘", cls: "avatar-a" },
    Kahu:  { img: "image (2).png", emoji: "🥰", cls: "avatar-b" }
  };
  function getAvatar(name) {
    return AVATARS[name] || { img: "", emoji: "💌", cls: "avatar-a" };
  }
  function buildAvatarEl(info) {
    const wrap = document.createElement("div");
    wrap.className = "avatar " + info.cls;
    if (info.img) {
      const img = document.createElement("img");
      img.src = info.img;
      img.alt = "";
      wrap.appendChild(img);
    } else {
      const fb = document.createElement("div");
      fb.className = "emoji-fallback";
      fb.textContent = info.emoji;
      wrap.appendChild(fb);
    }
    return wrap;
  }

  // --- PIN gate ---
  const PIN_CODE = "2626"; // 🔑 change this to your own 4-digit PIN
  const pinScreen = document.getElementById("pin-screen");
  const loginScreen = document.getElementById("login");
  const pinDigits = Array.from(document.querySelectorAll(".pin-digit"));
  pinDigits[0].focus();

  function handleDigitInput(digit, i) {
    digit.value = digit.value.replace(/[^0-9]/g, "").slice(0, 1);
    digit.classList.remove("error");
    if (digit.value && i < pinDigits.length - 1) pinDigits[i + 1].focus();
    if (pinDigits.every(d => d.value.length === 1)) checkPin();
  }
  pinDigits.forEach((digit, i) => {
    digit.addEventListener("input", () => handleDigitInput(digit, i));
    digit.addEventListener("keyup", () => handleDigitInput(digit, i));
    digit.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !digit.value && i > 0) pinDigits[i - 1].focus();
    });
    digit.addEventListener("paste", (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "");
      pinDigits.forEach((d, idx) => { d.value = pasted[idx] || ""; });
      const nextEmpty = pinDigits.findIndex(d => !d.value);
      (nextEmpty === -1 ? pinDigits[pinDigits.length - 1] : pinDigits[nextEmpty]).focus();
      if (pinDigits.every(d => d.value.length === 1)) checkPin();
    });
  });
  function checkPin() {
    const entered = pinDigits.map(d => d.value).join("");
    if (entered === PIN_CODE) {
      pinScreen.style.display = "none";
      loginScreen.style.display = "flex";
    } else {
      pinDigits.forEach(d => { d.classList.add("error"); d.value = ""; });
      pinDigits[0].focus();
    }
  }
  // --- end PIN gate ---

  window.enterChat = function () {
    myName = document.getElementById("userSelect").value;
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    startMessages();
  };

  // --- thoughts, written on the login screen, stored in Realtime Database ---
  const thoughtInput = document.getElementById("thoughtInput");
  const thoughtsList = document.getElementById("thoughtsList");

  window.saveThought = function () {
    const text = thoughtInput.value.trim();
    const who = document.getElementById("userSelect").value;
    if (!text) return;
    push(ref(db, "thoughts"), { text, sender: who, timestamp: Date.now() });
    thoughtInput.value = "";
  };

  onChildAdded(ref(db, "thoughts"), (snapshot) => {
    const data = snapshot.val();
    const item = document.createElement("div");
    item.className = "thought-item";
    const who = AVATARS[data.sender] ? data.sender : data.sender;
    item.innerHTML = `<span class="t-sender">${who}:</span>${data.text}<span class="t-time"></span>`;
    item.querySelector(".t-time").textContent = new Date(data.timestamp).toLocaleString();
    thoughtsList.appendChild(item);
    thoughtsList.scrollTop = thoughtsList.scrollHeight;
  });
  // --- end thoughts ---

  const input = document.getElementById("message-input");
  const sendBtn = document.getElementById("sendBtn");

  function sendMessage() {
    const text = input.value.trim();
    if (!text || !myName) return;
    if (text.toLowerCase() === "/clear") {
      input.value = "";
      setTyping(false);
      clearChat();
      return;
    }
    if (/^\/emoji\b/i.test(text)) {
      input.value = "";
      setTyping(false);
      sendEmojiWall(text.replace(/^\/emoji\s*/i, ""));
      return;
    }
    if (/^\/watch\b/i.test(text)) {
      input.value = "";
      setTyping(false);
      startWatch(text.replace(/^\/watch\s*/i, ""));
      return;
    }
    if (text.toLowerCase() === "/kiss") {
      input.value = "";
      setTyping(false);
      sendLove("kiss");
      return;
    }
    push(ref(db, "messages"), withReply({ type: "text", text, sender: myName, timestamp: Date.now() }));
    input.value = "";
    setTyping(false);
  }
  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendMessage(); }
  });

  function formatTime(ms) {
    const date = new Date(ms);
    let hours = date.getHours();
    let minutes = date.getMinutes().toString().padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    return `${hours}:${minutes} ${ampm}`;
  }

  // --- reactions ---
  const REACTION_EMOJIS = ["❤️", "😂", "😮", "🥺", "👍", "🔥"];
  const msgEls = {};          // messageKey -> reactions container element
  let reactionsData = {};     // messageKey -> { senderName: emoji }
  const rowEls = {};          // messageKey -> whole message row

  function toggleReaction(key, emoji) {
    if (!myName) return;
    const r = ref(db, `reactions/${key}/${myName}`);
    if (reactionsData[key] && reactionsData[key][myName] === emoji) remove(r);
    else set(r, emoji);
  }

  function renderReactions(key) {
    const box = msgEls[key];
    if (!box) return;
    box.innerHTML = "";
    const byEmoji = {};
    Object.entries(reactionsData[key] || {}).forEach(([who, emoji]) => {
      (byEmoji[emoji] = byEmoji[emoji] || []).push(who);
    });
    Object.entries(byEmoji).forEach(([emoji, who]) => {
      const chip = document.createElement("span");
      chip.className = "reaction-chip" + (who.includes(myName) ? " mine" : "");
      chip.textContent = who.length > 1 ? `${emoji} ${who.length}` : emoji;
      chip.title = who.join(", ");
      chip.addEventListener("click", () => toggleReaction(key, emoji));
      box.appendChild(chip);
    });
  }

  function closePickers() {
    document.querySelectorAll(".reaction-picker").forEach(p => p.remove());
  }
  document.addEventListener("click", closePickers);

  function showToast(text, ms = 1400) {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms);
  }
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      ta.remove();
    }
    showToast("Copied 💕");
  }

  // --- typing indicator ---
  const NAMES = { Kartu: "Kartik", Kahu: "Kahaani" };
  const typingPop = document.getElementById("typing-pop");
  let typingTimer = null, isTyping = false;

  function setTyping(on) {
    if (!myName) return;
    const r = ref(db, `typing/${myName}`);
    if (on) {
      if (!isTyping) {
        isTyping = true;
        set(r, true);
        onDisconnect(r).remove();
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => setTyping(false), 2500);
    } else {
      clearTimeout(typingTimer);
      if (isTyping) { isTyping = false; remove(r); }
    }
  }
  document.getElementById("message-input").addEventListener("input", (e) => {
    setTyping(e.target.value.length > 0);
  });

  function listenTyping() {
    onValue(ref(db, "typing"), (snap) => {
      const val = snap.val() || {};
      const others = Object.keys(val).filter(n => n !== myName);
      if (!others.length) { typingPop.style.display = "none"; return; }
      const who = others[0];
      const av = buildAvatarEl(getAvatar(who));
      av.classList.add("mini");
      const txt = document.createElement("span");
      txt.textContent = `${NAMES[who] || who} is typing`;
      const dots = document.createElement("span");
      dots.className = "dots";
      dots.innerHTML = "<i></i><i></i><i></i>";
      typingPop.innerHTML = "";
      typingPop.append(av, txt, dots);
      typingPop.style.display = "flex";
    });
  }
  // --- end typing indicator ---

  // --- /clear command ---
  async function clearChat() {
    if (!confirm("Clear the whole chat for both of you? This can't be undone 🥺")) return;
    try {
      setReply(null);
      await remove(ref(db, "messages"));
      await remove(ref(db, "reactions"));
      showToast("Chat cleared 🧹");
    } catch (err) {
      console.error(err);
      showToast("Couldn't clear the chat 🥺");
    }
  }

  // --- photos: resized + compressed in the browser, stored in the database ---
  const imgBtn = document.getElementById("img-btn");
  const imgFile = document.getElementById("img-file");
  imgBtn.addEventListener("click", () => { if (myName) imgFile.click(); });
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(",")[1]);
      r.onerror = () => reject(new Error("could not read file"));
      r.readAsDataURL(file);
    });
  }
  // sends the ORIGINAL file to the owner's Google Drive (through the Apps Script), returns the Drive file id
  async function uploadToDrive(file) {
    const data = await fileToBase64(file);
    const safe = (file.name || "photo").replace(/[^\w.\- ]/g, "_");
    const res = await fetch(DRIVE_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ secret: DRIVE_SECRET, name: `${myName}-${Date.now()}-${safe}`, mime: file.type || "image/jpeg", data })
    });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || "upload failed");
    return out.id;
  }
  function driveImgUrls(id) {
    return [
      `https://drive.google.com/thumbnail?id=${id}&sz=w1200`,
      `https://lh3.googleusercontent.com/d/${id}=w1200`,
      `https://drive.google.com/thumbnail?id=${id}&sz=w1200&r=2`,
      `https://lh3.googleusercontent.com/d/${id}=w1200?r=2`
    ];
  }
  function loadDriveImage(im, id) {
    const urls = driveImgUrls(id);
    let i = 0;
    im.src = urls[0];
    im.addEventListener("error", () => {
      i++;
      if (i < urls.length) setTimeout(() => { im.src = urls[i]; }, 1800);
    });
  }

  imgFile.addEventListener("change", async () => {
    const file = imgFile.files[0];
    imgFile.value = "";
    if (!file || !myName) return;
    try {
      if (DRIVE_URL) {
        if (file.size > 30 * 1024 * 1024) { showToast("That photo is over 30 MB 🥺"); return; }
        showToast("Uploading to Drive 📤", 30000);
        try {
          const driveId = await uploadToDrive(file);
          await push(ref(db, "messages"), withReply({ type: "image", driveId, sender: myName, timestamp: Date.now() }));
          showToast("Sent 📸");
          return;
        } catch (err) {
          console.error(err);
          showToast("Drive upload failed, sending a smaller copy 🥺", 2500);
        }
      } else {
        showToast("Sending photo 📸");
      }
      const url = await compressImage(file);
      await push(ref(db, "messages"), withReply({ type: "image", url, sender: myName, timestamp: Date.now() }));
    } catch (err) {
      console.error(err);
      showToast("Couldn't send that photo 🥺");
    }
  });
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objUrl = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(objUrl);
        let max = 900, quality = 0.72, out;
        for (let i = 0; i < 4; i++) {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/jpeg", quality);
          if (out.length < 400000) break;
          max *= 0.75;
          quality -= 0.1;
        }
        resolve(out);
      };
      img.onerror = () => reject(new Error("bad image"));
      img.src = objUrl;
    });
  }

  // --- replies ---
  const chatEl = document.getElementById("chat");
  const replyBar = document.getElementById("reply-bar");
  let replyTo = null;
  function previewOf(d) {
    if (d.type === "image") return "📷 Photo";
    if (d.type === "gif") return "GIF 🎞️";
    return (d.text || "").slice(0, 80);
  }
  function setReply(r) {
    replyTo = r;
    if (!r) {
      replyBar.style.display = "none";
      chatEl.classList.remove("replying");
      return;
    }
    replyBar.innerHTML = "";
    const t = document.createElement("div");
    t.className = "rb-text";
    const who = document.createElement("b");
    who.textContent = "Replying to " + (NAMES[r.sender] || r.sender);
    const pv = document.createElement("span");
    pv.textContent = r.preview;
    t.append(who, pv);
    const x = document.createElement("span");
    x.className = "rb-x";
    x.textContent = "✕";
    x.addEventListener("click", () => setReply(null));
    replyBar.append(t, x);
    replyBar.style.display = "flex";
    chatEl.classList.add("replying");
    document.getElementById("message-input").focus();
  }
  function withReply(obj) {
    if (replyTo) { obj.replyTo = replyTo; setReply(null); }
    return obj;
  }
  function jumpTo(key) {
    const el = rowEls[key];
    if (!el) { showToast("That message is gone 🥺"); return; }
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 1600);

  function playLoveAnimation(sender) {
    if (document.getElementById("love-overlay")) return;
    const ov = document.createElement("div");

  // --- /emoji "😍": a wall of emojis rises up the screen (plays for the other person when they open the chat) ---
  const EMOJI_RE = /\p{Extended_Pictographic}(?:\uFE0F|\u20E3|[\u{1F3FB}-\u{1F3FF}]|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu;
  const fxQueue = [];
  let fxPlaying = false;
  function queueEmojiWall(list) {
    if (fxQueue.length >= 3) return;
    fxQueue.push(list);
    if (!fxPlaying) nextFx();
  }
  function nextFx() {
    const list = fxQueue.shift();
    if (!list) { fxPlaying = false; return; }
    fxPlaying = true;
    playEmojiWall(list);
    setTimeout(nextFx, 3200);
  }
  function playEmojiWall(emojis) {
    const wall = document.createElement("div");
    wall.className = "emoji-wall";
    const cols = Math.max(6, Math.min(14, Math.floor(window.innerWidth / 46)));
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < 5; r++) {
        const e = document.createElement("span");
        e.className = "emoji-rise";
        e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        e.style.left = ((c + 0.5) / cols * 100 + (Math.random() * 4 - 2)) + "%";
        e.style.fontSize = (1.8 + Math.random() * 1.6) + "rem";
        e.style.animationDuration = (2.4 + Math.random() * 1.2) + "s";
        e.style.animationDelay = (Math.random() * 0.8 + r * 0.4) + "s";
        e.style.setProperty("--sway", (Math.random() * 60 - 30) + "px");
        e.style.setProperty("--rot", (Math.random() * 40 - 20) + "deg");
        wall.appendChild(e);
      }
    }
    document.body.appendChild(wall);
    setTimeout(() => wall.remove(), 6200);
  }
  function sendEmojiWall(arg) {
    const found = (arg.match(EMOJI_RE) || []).slice(0, 6);
    if (!found.length) { showToast('Try /emoji "😍" 💕'); return; }
    queueEmojiWall(found);
    push(ref(db, "emojiFx"), { emojis: found, sender: myName, timestamp: serverTimestamp() });
  }

  // --- (+) full emoji sheet for reactions ---
  const EMOJI_SETS = {
    "😊": "😀 😃 😄 😁 😆 😅 😂 🤣 🥲 ☺️ 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🥸 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 ☹️ 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🫣 🤭 🫢 🫡 🤫 🫠 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🥴 🤢 🤮 🤧 😷 🤒 🤕 🤑 🤠 😈 👿 👻 💀 🤡 💩",

  };
  function closeEmojiSheet() {
    const b = document.getElementById("emoji-backdrop");
    if (b) b.remove();
  }
  function openEmojiSheet(key) {
    closeEmojiSheet();
    const back = document.createElement("div");
    back.id = "emoji-backdrop";
    back.addEventListener("click", (e) => { if (e.target === back) closeEmojiSheet(); });
    const sheet = document.createElement("div");
    sheet.id = "emoji-sheet";
    const pick = (em) => { toggleReaction(key, em); closeEmojiSheet(); };

    const head = document.createElement("div");
    head.className = "es-head";
    const inp = document.createElement("input");
    inp.type = "text";
    inp.className = "es-input";
    inp.placeholder = "type or paste any emoji…";
    inp.addEventListener("input", () => {
      const m = inp.value.match(EMOJI_RE);
      if (m) pick(m[0]);
    });
    const x = document.createElement("span");
    x.className = "es-x";
    x.textContent = "✕";
    x.addEventListener("click", closeEmojiSheet);
    head.append(inp, x);

    const tabs = document.createElement("div");
    tabs.className = "es-tabs";
    const grid = document.createElement("div");
    grid.className = "es-grid";
    function show(name) {
      grid.innerHTML = "";
      EMOJI_SETS[name].split(" ").forEach((em) => {
        const it = document.createElement("span");
        it.className = "es-item";
        it.textContent = em;
        it.addEventListener("click", () => pick(em));
        grid.appendChild(it);
      });
      tabs.querySelectorAll("span").forEach((t) => t.classList.toggle("on", t.dataset.k === name));
    }
    Object.keys(EMOJI_SETS).forEach((k) => {
      const t = document.createElement("span");
      t.textContent = k;
      t.dataset.k = k;
      t.addEventListener("click", () => show(k));
      tabs.appendChild(t);
    });
    sheet.append(head, tabs, grid);
    back.appendChild(sheet);
    document.body.appendChild(back);
    show(Object.keys(EMOJI_SETS)[0]);
  }

  // --- a single emoji is shown big ---
  const SINGLE_EMOJI_RE = new RegExp("^(?:" + EMOJI_RE.source + ")$", "u");

  // --- /watch <youtube link>: watch together, play / pause / seek stay in sync ---
  const watchDock = document.getElementById("watch-dock");
  const wdMin = document.getElementById("wd-min");
  let player = null, playerReady = false, currentVideoId = null;
  let watchState = null, lastKnown = null, applyUntil = 0;
  let echoState = null, echoUntil = 0;   // the player state we just caused ourselves (so we don't re-broadcast it)
  const expectEcho = (state) => { echoState = state; echoUntil = Date.now() + 2000; };
  let ytLoading = false;
  const ytWaiters = [];
  const isApplying = () => Date.now() < applyUntil;

  function parseYouTubeId(t) {
    const m = t.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^\s]*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/);
    return m ? m[1] : null;
  }
  function loadYT(cb) {
    if (window.YT && window.YT.Player) { cb(); return; }
    ytWaiters.push(cb);
    if (ytLoading) return;
    ytLoading = true;
    window.onYouTubeIframeAPIReady = () => { ytWaiters.splice(0).forEach((f) => f()); };
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    tag.onerror = () => { ytLoading = false; showToast("Couldn't load YouTube 🥺", 3000); };
    document.head.appendChild(tag);
  }
  function targetOf(st) {
    const ts = typeof st.ts === "number" ? st.ts : Date.now() + serverOffset;
    return st.time + (st.playing ? Math.max(0, (Date.now() + serverOffset - ts) / 1000) : 0);
  }
  function showDock() {
    watchDock.style.display = "flex";
    watchDock.classList.remove("mini");
    wdMin.textContent = "▁";
  }
  function endWatchLocal() {
    if (player) { try { player.destroy(); } catch (e) {} }
    player = null; playerReady = false; currentVideoId = null; lastKnown = null;
    document.getElementById("yt-mount").innerHTML = "";
    watchDock.style.display = "none";
    watchDock.classList.remove("mini");
  }
  function applyWatchState(st) {
    if (!player || !playerReady || !st) return;
    applyUntil = Date.now() + 1200;
    try {
      const target = targetOf(st);
      if (Math.abs(player.getCurrentTime() - target) > 1.5) player.seekTo(target, true);
      const ps = player.getPlayerState();
      if (st.playing && ps !== 1 && ps !== 3) { expectEcho(1); player.playVideo(); }
      if (!st.playing && ps !== 2) { expectEcho(2); player.pauseVideo(); }
      lastKnown = { time: target, at: Date.now(), playing: st.playing };
    } catch (e) { console.error(e); }
  }
  function pushWatchState(playing, time) {
    if (!currentVideoId) return;
    lastKnown = { time, at: Date.now(), playing };
    set(ref(db, "watch"), {
      videoId: currentVideoId, playing, time, ts: serverTimestamp(), by: myName,
      session: (watchState && watchState.session) || Date.now()
    });
  }
  function onPlayerStateChange(ev) {
    if (!player) return;
    if (ev.data === echoState && Date.now() < echoUntil) { echoState = null; return; }
    const cur = player.getCurrentTime();
    if (ev.data === 1) pushWatchState(true, cur);
    else if (ev.data === 2) pushWatchState(false, cur);
    else if (ev.data === 0) pushWatchState(false, cur);
  }
  // catches scrubbing the timeline (YouTube has no "seek" event)
  function syncPoll() {
    if (!player || !playerReady || isApplying() || !lastKnown) return;
    try {
      const st = player.getPlayerState();
      if (st === 3) return;
      const cur = player.getCurrentTime();
      const expected = lastKnown.playing ? lastKnown.time + (Date.now() - lastKnown.at) / 1000 : lastKnown.time;
      if (Math.abs(cur - expected) > 2.5) pushWatchState(st === 1, cur);
    } catch (e) {}
  }
  function ensurePlayer(videoId, startAt) {
    loadYT(() => {
      if (player && playerReady) {
        if (currentVideoId !== videoId) {
          currentVideoId = videoId;
          applyUntil = Date.now() + 1500;
          expectEcho(1);
          player.loadVideoById({ videoId, startSeconds: Math.max(0, startAt) });
          setTimeout(() => applyWatchState(watchState), 900);
        } else {
          applyWatchState(watchState);
        }
        return;
      }
      if (player) return;
      currentVideoId = videoId;
      document.getElementById("yt-mount").innerHTML = '<div id="yt-player"></div>';
      const startPlaying = !(watchState && watchState.playing === false);
      expectEcho(startPlaying ? 1 : 2);
      player = new YT.Player("yt-player", {
        videoId,
        playerVars: { playsinline: 1, rel: 0, autoplay: startPlaying ? 1 : 0 },
        events: {
          onReady: () => { playerReady = true; applyWatchState(watchState); },
          onStateChange: onPlayerStateChange,
          onError: () => showToast("YouTube won't play that one here 🥺", 3000)
        }
      });
    });
  }
  function startPlayerFor(st) {
    showDock();
    ensurePlayer(st.videoId, targetOf(st));
  }
  function startWatch(arg) {
    const text = arg.trim();
    if (!text) {
      if (watchState && player) showDock();
      else showToast("Try /watch + a YouTube link 📺", 2500);
      return;
    }
    const id = parseYouTubeId(text);
    if (!id) { showToast("That doesn't look like a YouTube link 🥺", 2500); return; }
    const st = { videoId: id, playing: true, time: 0, ts: serverTimestamp(), by: myName, session: Date.now() };
    watchState = Object.assign({}, st, { ts: Date.now() + serverOffset });
    startPlayerFor(watchState);
    set(ref(db, "watch"), st);
  }
  document.getElementById("wd-play").addEventListener("click", () => {
    if (!player || !playerReady) return;
    if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
  });
  wdMin.addEventListener("click", () => {
    const mini = watchDock.classList.toggle("mini");
    wdMin.textContent = mini ? "⤢" : "▁";
  });
  document.getElementById("wd-close").addEventListener("click", () => {
    if (confirm("End watching together for both of you?")) remove(ref(db, "watch"));
  });

  let messagesStarted = false;
  function startMessages() {
    if (messagesStarted) return;
    messagesStarted = true;

    listenTyping();

    onValue(ref(db, ".info/serverTimeOffset"), (s) => { serverOffset = s.val() || 0; });

    // emoji walls sent by the other person: play now, or as soon as this chat is opened
    const seenFx = new Set();
    onChildAdded(ref(db, "emojiFx"), (snap) => {
      const d = snap.val();
      if (!d || d.sender === myName || seenFx.has(snap.key)) return;
      seenFx.add(snap.key);
      remove(ref(db, "emojiFx/" + snap.key));
      if (typeof d.timestamp === "number" && Date.now() + serverOffset - d.timestamp > 86400000) return;
      const list = Array.isArray(d.emojis) ? d.emojis : Object.values(d.emojis || {});
      if (list.length) setTimeout(() => queueEmojiWall(list), 500);
    });

    // watch together: everyone follows the shared play / pause / position
    let watchSeen = false;
    onValue(ref(db, "watch"), (snap) => {
      const st = snap.val();
      const first = !watchSeen;
      watchSeen = true;
      if (!st) {
        if (watchState) { endWatchLocal(); if (!first) showToast("Watching together ended 📺", 2000); }
        watchState = null;
        return;
      }
      const prev = watchState;
      const isNew = !prev || prev.session !== st.session || prev.videoId !== st.videoId;
      const age = typeof st.ts === "number" ? Date.now() + serverOffset - st.ts : 0;
      if (isNew && first && age > 2 * 3600 * 1000) return;   // old leftover session
      watchState = st;
      if (isNew) {
        if (st.by !== myName) showToast((NAMES[st.by] || st.by) + " is watching a video, joining 📺", 2500);
        startPlayerFor(st);
      } else if (st.by !== myName) {
        applyWatchState(st);
      }
    });
    setInterval(syncPoll, 1000);
    onChildAdded(ref(db, "events"), (snap) => {
      const d = snap.val();
      if (!d || typeof d.timestamp !== "number") return;
      if (Date.now() + serverOffset - d.timestamp > 10000) return;
      playLoveAnimation(d.sender);
    });

    onChildRemoved(ref(db, "messages"), (snap) => {
      const k = snap.key;
      if (rowEls[k]) { rowEls[k].remove(); delete rowEls[k]; }
      delete msgEls[k];
    });

    onValue(ref(db, "reactions"), (snap) => {
      reactionsData = snap.val() || {};
      Object.keys(msgEls).forEach(renderReactions);
    });

    onChildAdded(ref(db, "messages"), (snapshot) => {
      const key = snapshot.key;
      const data = snapshot.val();
      const isMe = data.sender === myName;

      const row = document.createElement("div");
      row.className = "message-row " + (isMe ? "sent" : "received");

      const avatar = buildAvatarEl(getAvatar(data.sender));

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const msg = document.createElement("div");
      msg.className = "message";

      const senderLabel = document.createElement("div");
      senderLabel.className = "sender";
      senderLabel.textContent = data.sender;

      let content;
      if (data.type === "image" && data.driveId) {
        content = document.createElement("div");
        const im = document.createElement("img");
        im.className = "gif-message photo-message";
        im.referrerPolicy = "no-referrer";
        loadDriveImage(im, data.driveId);
        im.addEventListener("load", () => { chatBox.scrollTop = chatBox.scrollHeight; });
        const link = document.createElement("a");
        link.className = "full-link";
        link.href = "https://drive.google.com/file/d/" + data.driveId + "/view";
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "⬇ full resolution";
        link.addEventListener("click", (e) => e.stopPropagation());
        content.append(im, link);
      } else if (data.type === "gif" || data.type === "image") {
        content = document.createElement("img");
        content.src = data.url;
        content.className = data.type === "image" ? "gif-message photo-message" : "gif-message";
        content.addEventListener("load", () => { chatBox.scrollTop = chatBox.scrollHeight; });
      } else {
        content = document.createElement("div");
        content.textContent = data.text;
        if (SINGLE_EMOJI_RE.test((data.text || "").trim())) { content.className = "big-emoji"; msg.classList.add("emoji-only"); }
      }

      const timeLabel = document.createElement("div");
      timeLabel.className = "timestamp";
      timeLabel.textContent = formatTime(data.timestamp);

      msg.appendChild(senderLabel);
      if (data.replyTo) {
        const q = document.createElement("div");
        q.className = "reply-quote";
        const qn = document.createElement("div");
        qn.className = "rq-name";
        qn.textContent = NAMES[data.replyTo.sender] || data.replyTo.sender;
        const qt = document.createElement("div");
        qt.className = "rq-text";
        qt.textContent = data.replyTo.preview;
        q.append(qn, qt);
        q.addEventListener("click", (e) => { e.stopPropagation(); jumpTo(data.replyTo.key); });
        msg.appendChild(q);
      }
      msg.appendChild(content);
      msg.appendChild(timeLabel);

      // double-tap = ❤️ (like Instagram), triple-tap = copy text
      let taps = 0, tapTimer, heartTimer;
      msg.addEventListener("click", () => {
        taps++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { taps = 0; }, 450);
        if (taps === 2) {
          heartTimer = setTimeout(() => toggleReaction(key, "❤️"), 450);
        } else if (taps === 3) {
          clearTimeout(heartTimer);
          taps = 0;
          if (data.type === "image") showToast("Photos can't be copied 📷");
          else copyText(data.type === "gif" ? data.url : data.text);
        }
      });

      const reactionsBox = document.createElement("div");
      reactionsBox.className = "reactions";
      msgEls[key] = reactionsBox;

      wrap.appendChild(msg);
      wrap.appendChild(reactionsBox);

      // reaction picker trigger
      const trigger = document.createElement("div");
      trigger.className = "react-trigger";
      trigger.textContent = "☺";
      trigger.addEventListener("click", (e) => {
        e.stopPropagation();
        const already = wrap.querySelector(".reaction-picker");
        closePickers();
        if (already) return;
        const picker = document.createElement("div");
        picker.className = "reaction-picker";
        REACTION_EMOJIS.forEach(em => {
          const o = document.createElement("span");
          o.textContent = em;
          o.addEventListener("click", (ev) => {
            ev.stopPropagation();
            toggleReaction(key, em);
            closePickers();
          });
          picker.appendChild(o);
        });
        const more = document.createElement("span");
        more.className = "pick-more";
        more.textContent = "+";
        more.title = "More emojis";
        more.addEventListener("click", (ev) => {
          ev.stopPropagation();
          closePickers();
          openEmojiSheet(key);
        });
        picker.appendChild(more);
        wrap.appendChild(picker);
        // not enough room above this message (e.g. first one in the chat)? open the picker below it
        if (wrap.getBoundingClientRect().top - chatBox.getBoundingClientRect().top < 64) picker.classList.add("below");
      });

      row.appendChild(avatar);
      row.appendChild(wrap);
      const replyBtn = document.createElement("div");
      replyBtn.className = "react-trigger";
      replyBtn.textContent = "↩";
      replyBtn.title = "Reply";
      replyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        setReply({ key, sender: data.sender, preview: previewOf(data) });
      });
      const actions = document.createElement("div");
      actions.className = "msg-actions";
      actions.append(trigger, replyBtn);
      row.appendChild(actions);
      chatBox.appendChild(row);
      rowEls[key] = row;

      renderReactions(key);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  }
  // --- end reactions ---

  // --- emoticon shortcuts: :) -> 😁 etc ---
  const EMOTICONS = [
    [":'(", "😭"], [":)", "😁"], [":(", "🥺"], [":P", "😜"], [":p", "😜"],
    [":D", "😄"], [";)", "😉"], [":O", "😮"], [":o", "😮"], [":*", "😘"], ["<3", "❤️"]
  ];
  const EMO_RE = new RegExp(EMOTICONS.map(([k]) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  const EMO_MAP = Object.fromEntries(EMOTICONS);
  function attachEmoticons(el) {
    el.addEventListener("input", () => {
      const before = el.value;
      const after = before.replace(EMO_RE, m => EMO_MAP[m]);
      if (after !== before) {
        const pos = el.selectionStart;
        el.value = after;
        const np = Math.max(0, pos + (after.length - before.length));
        el.setSelectionRange(np, np);
      }
    });
  }
  attachEmoticons(document.getElementById("message-input"));
  attachEmoticons(document.getElementById("thoughtInput"));
  // --- end emoticons ---

  // Close GIF panel when clicking outside
  document.addEventListener("click", (e) => {
    const isClickInside = gifPanel.contains(e.target) || gifToggle.contains(e.target);
    if (!isClickInside) gifPanel.style.display = "none";
  });

  const gifPanel = document.getElementById("gif-panel");
  const gifToggle = document.getElementById("gif-toggle");
  const gifSearch = document.getElementById("gif-search");
  const gifResults = document.getElementById("gif-results");

  const GIPHY_KEY = "593h4BgJ8UrK3FBYb4uNZZQRLvtjEF2f";

  gifToggle.addEventListener("click", () => {
    gifPanel.style.display = gifPanel.style.display === "none" ? "block" : "none";
  });

  gifSearch.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const q = gifSearch.value.trim();
      if (!q) return;
      const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(q)}&limit=12`);
      const data = await res.json();
      gifResults.innerHTML = "";
      data.data.forEach(gif => {
        const img = document.createElement("img");
        img.src = gif.images.fixed_height_small.url;
        img.addEventListener("click", () => {
          push(ref(db, "messages"), withReply({ type: "gif", url: gif.images.original.url, sender: myName, timestamp: Date.now() }));
          gifPanel.style.display = "none";
        });
        gifResults.appendChild(img);
      });
    }
  });
</script>
