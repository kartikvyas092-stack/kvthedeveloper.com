<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>K & K chat 💞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1c1322;
    --bg-mid:#271a2e;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.09);
    --pink:#ffb3c6;
    --lav:#d6b8ff;
    --mint:#b9f3df;
    --peach:#ffd3a0;
    --text:#fbeef2;
    --text-dim:#c9b8ce;
  }
  *{box-sizing:border-box;}
  body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,179,198,0.18), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(214,184,255,0.16), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(185,243,223,0.1), transparent 50%),
      linear-gradient(#1c1322, #110b16);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    background: var(--panel);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
    text-align: center;
    padding: 0.85em;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.4em;
    letter-spacing: 0.3px;
    color: var(--pink);
    text-shadow: 0 0 16px rgba(255,179,198,0.4);
  }
  header .heart { display:inline-block; animation: pulseHeart 1.6s ease-in-out infinite; }
  @keyframes pulseHeart { 0%,100%{transform:scale(1) rotate(0deg);} 50%{transform:scale(1.2) rotate(-6deg);} }

  #pin-screen, #login {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: var(--text);
    position: relative;
    overflow-y: auto;
    gap: 0.5em;
    text-align: center;
    padding: 2em 1.2em;
  }
  #pin-screen{ display:flex; }
  #login{ display:none; }

  #pin-screen p, #login label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.25em;
    color: var(--pink);
    margin-bottom: 0.5em;
  }

  #pin-inputs { display: flex; gap: 0.7em; }
  .pin-digit {
    width: 48px; height: 58px;
    text-align: center;
    font-size: 1.6em;
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    outline: none;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 0 16px rgba(214,184,255,0.25);
    -webkit-text-security: disc;
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .pin-digit:focus { border-color: var(--pink); box-shadow: 0 0 20px rgba(255,179,198,0.5); }
  .pin-digit.error { animation: shake 0.3s; box-shadow: 0 0 14px rgba(255,90,90,0.7); border-color:#ff6b6b; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  #login::before {
    content:"";
    position:absolute; inset:0;
    background-image: url("YOUR_IMAGE_URL_HERE.jpg");
    background-size:cover; background-position:center;
    opacity:0.6; z-index:0;
  }
  #login > * { position:relative; z-index:1; }

  #userSelect {
    padding: 0.85em 1.2em;
    margin: 0.5em 0;
    border-radius: 25px;
    border: 1px solid var(--panel-border);
    outline: none;
    background: var(--bg-mid);
    color: var(--lav);
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1em;
    box-shadow: 0 0 14px rgba(214,184,255,0.3);
    cursor: pointer;
    transition: 0.3s;
  }
  #userSelect:hover { background:#32223b; }

  #login button.login {
    display: inline-flex; align-items:center; justify-content:center;
    padding: 12px 30px; margin-top: 0.9em; min-width: 150px; height: 46px;
    border-radius: 30px; border: none;
    background: linear-gradient(135deg, var(--pink), var(--peach));
    color: #241627; font-family:'Fredoka',sans-serif; font-size: 1rem; font-weight: 600;
    cursor: pointer; box-shadow: 0 0 18px rgba(255,179,198,0.5); letter-spacing:0.3px;
    transition: all 0.25s ease;
  }
  #login button.login:hover { transform: translateY(-2px) scale(1.05) rotate(-1deg); box-shadow: 0 0 26px rgba(255,211,160,0.7); }
  #login button.login:active { transform: scale(0.96); }

  #thought-card {
    margin-top: 1.6em;
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 1em 1.1em;
  }
  #thought-card p.label {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1em;
    color: var(--mint);
    margin: 0 0 0.6em;
  }
  #thoughtInput {
    width: 100%; resize: none; min-height: 54px;
    padding: 0.7em 0.9em; border-radius: 14px; border: 1px solid var(--panel-border);
    background: var(--bg-mid); color: var(--text); font-family:'Quicksand',sans-serif;
    font-size: 0.95em; outline: none;
  }
  #thought-card .send-thought {
    margin-top: 0.6em; width:100%; height:40px; border-radius:16px; border:none;
    background: linear-gradient(135deg, var(--mint), var(--lav));
    color:#201529; font-family:'Fredoka',sans-serif; font-weight:600; font-size:0.9em;
    cursor:pointer; box-shadow: 0 0 14px rgba(185,243,223,0.4);
  }
  #thoughtsList { margin-top: 0.8em; max-height: 140px; overflow-y: auto; text-align:left; display:flex; flex-direction:column; gap:0.5em; }
  .thought-item {
    background: rgba(255,255,255,0.04); border-radius: 12px; padding: 0.5em 0.7em;
    font-size: 0.82em; line-height:1.3;
  }
  .thought-item .t-sender { color: var(--pink); font-weight:600; margin-right:0.3em; }
  .thought-item .t-time { display:block; opacity:0.5; font-size:0.75em; margin-top:0.15em; }

  #chat { display:none; position:relative; flex:1; flex-direction:column; min-height:0; }

  #chat-box {
    flex: 1; overflow-y: auto; padding: 1em;
    display: flex; flex-direction: column; gap: 2px;
  }

  #gif-panel {
    position: absolute; bottom: 68px; left: 0; right: 0;
    background: var(--bg-mid); padding: 10px;
    border-top: 1px solid var(--panel-border);
    max-height: 200px; overflow-y: auto; z-index: 1000;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }

  #gif-search {
    width:100%; padding:8px 14px; border-radius:20px; border:none; outline:none;
    background:#241a2b; color:var(--text); margin-bottom:10px; font-family:'Quicksand',sans-serif;
  }
  #gif-results { display:grid; grid-template-columns: repeat(auto-fill, 100px); gap:8px; }
  #gif-results img { width:100px; border-radius:10px; cursor:pointer; transition: transform 0.2s; }
  #gif-results img:hover { transform: scale(1.08); }

  .message-row { display:flex; align-items:flex-end; gap:0.5em; margin:0.45em 0.8em; max-width:78%; }
  .message-row.sent { align-self:flex-end; flex-direction:row-reverse; }
  .message-row.received { align-self:flex-start; }

  .avatar {
    width:38px; height:38px; min-width:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.15em; flex-shrink:0;
    box-shadow:0 0 14px rgba(255,179,198,0.45);
    animation: floatAvatar 3.2s ease-in-out infinite;
  }
  .avatar.avatar-a { background: linear-gradient(135deg, var(--pink), var(--peach)); }
  .avatar.avatar-b { background: linear-gradient(135deg, var(--lav), var(--mint)); }
  @keyframes floatAvatar { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }

  .message {
    padding: 0.65em 0.9em;
    border-radius: 18px;
    font-size: 0.95em;
    display: flex; flex-direction: column;
    white-space: normal; word-break: break-word; overflow-wrap: anywhere;
    border: 1px solid var(--panel-border);
  }
  .sent .message {
    background: linear-gradient(135deg, rgba(255,179,198,0.28), rgba(255,211,160,0.18));
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .received .message {
    background: var(--panel);
    backdrop-filter: blur(6px);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .sender { font-size:0.72em; opacity:0.8; margin-bottom:0.25em; color: var(--mint); font-weight:600; }
  .timestamp { font-size:0.68em; opacity:0.6; align-self:flex-end; margin-top:0.35em; }

  footer {
    display: flex; align-items:center; padding: 0.6em 0.8em;
    background: var(--panel); backdrop-filter: blur(10px);
    border-top: 1px solid var(--panel-border);
    padding-bottom: calc(0.6em + env(safe-area-inset-bottom, 0px));
  }
  input[type="text"] {
    flex: 1; padding: 0.85em 1.1em; border: 1px solid var(--panel-border);
    border-radius: 22px; outline: none; font-size: 1em;
    background: var(--bg-mid); color: var(--text); font-family:'Quicksand',sans-serif;
  }
  button {
    background: linear-gradient(135deg, var(--pink), var(--lav));
    color: #241627; border: none; border-radius: 50%;
    width: 46px; height: 46px; margin-left: 0.5em; cursor: pointer;
    font-size: 1.2em; box-shadow: 0 0 14px rgba(214,184,255,0.45);
    transition: transform 0.2s;
  }
  button:hover { transform: scale(1.08) rotate(-4deg); }
  .message img.gif-message {
    max-width: 180px; border-radius: 14px; display: block; margin-top: 6px;
    box-shadow: 0 0 12px rgba(255,179,198,0.4);
  }
</style>
</head>
<body>
<header><span class="heart">🫶</span> K &amp; K chat <span class="heart">🫶</span></header>

<div id="pin-screen">
  <p>psst... secret code? 🔐</p>
  <div id="pin-inputs">
    <input type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="1" class="pin-digit" data-index="0">
    <input type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="1" class="pin-digit" data-index="1">
    <input type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="1" class="pin-digit" data-index="2">
    <input type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="1" class="pin-digit" data-index="3">
  </div>
</div>

<div id="login">
  <label for="userSelect">who's this cutie? 🥹</label>
  <select id="userSelect">
    <option value="Kartu">Kartik</option>
    <option value="Kahu">Kahaani</option>
  </select>
  <button class="login" onclick="enterChat()">let's gooo 💕</button>

  <div id="thought-card">
    <p class="label">leave a lil' thought 💭</p>
    <textarea id="thoughtInput" placeholder="what's on your mind, pookie?"></textarea>
    <button class="send-thought" onclick="saveThought()">send it 🤍</button>
    <div id="thoughtsList"></div>
  </div>
</div>

<div id="chat">
  <div id="chat-box"></div>
  <footer>
    <input type="text" id="message-input" placeholder="Type a message...">
    <button id="sendBtn">➤</button>
    <div id="gif-panel" style="display:none;">
      <input type="text" id="gif-search" placeholder="Search GIFs...">
      <div id="gif-results"></div>
    </div>
    <button id="gif-toggle">🎞️</button>
  </footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded }
    from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBeewPIldcE5h4bP1mAzkk4PLSFY6AjE1c",
    authDomain: "chat-v2626.firebaseapp.com",
    databaseURL: "https://chat-v2626-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "chat-v2626",
    storageBucket: "chat-v2626.firebasestorage.app",
    messagingSenderId: "403392475876",
    appId: "1:403392475876:web:838695d5114c330a08f2f1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let myName = null;
  const chatBox = document.getElementById("chat-box");

  // --- avatars: emoji + gradient per sender ---
  const AVATARS = {
    Kartu: {  img: "/image (1).png",emoji: "🧸", cls: "avatar-a" },
    Kahu:  { img: "/image (2).png",emoji: "🦋", cls: "avatar-b" }
  };
  function getAvatar(name) {
    return AVATARS[name] || { emoji: "💌", cls: "avatar-a" };
  }

  // --- PIN gate ---
  const PIN_CODE = "1234"; // 🔑 change this to your own 4-digit PIN
  const pinScreen = document.getElementById("pin-screen");
  const loginScreen = document.getElementById("login");
  const pinDigits = Array.from(document.querySelectorAll(".pin-digit"));
  pinDigits[0].focus();

  function handleDigitInput(digit, i) {
    digit.value = digit.value.replace(/[^0-9]/g, "").slice(0, 1);
    digit.classList.remove("error");
    if (digit.value && i < pinDigits.length - 1) pinDigits[i + 1].focus();
    if (pinDigits.every(d => d.value.length === 1)) checkPin();
  }
  pinDigits.forEach((digit, i) => {
    digit.addEventListener("input", () => handleDigitInput(digit, i));
    digit.addEventListener("keyup", () => handleDigitInput(digit, i));
    digit.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !digit.value && i > 0) pinDigits[i - 1].focus();
    });
    digit.addEventListener("paste", (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "");
      pinDigits.forEach((d, idx) => { d.value = pasted[idx] || ""; });
      const nextEmpty = pinDigits.findIndex(d => !d.value);
      (nextEmpty === -1 ? pinDigits[pinDigits.length - 1] : pinDigits[nextEmpty]).focus();
      if (pinDigits.every(d => d.value.length === 1)) checkPin();
    });
  });
  function checkPin() {
    const entered = pinDigits.map(d => d.value).join("");
    if (entered === PIN_CODE) {
      pinScreen.style.display = "none";
      loginScreen.style.display = "flex";
    } else {
      pinDigits.forEach(d => { d.classList.add("error"); d.value = ""; });
      pinDigits[0].focus();
    }
  }
  // --- end PIN gate ---

  window.enterChat = function () {
    myName = document.getElementById("userSelect").value;
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
  };

  // --- thoughts, written on the login screen, stored in Realtime Database ---
  const thoughtInput = document.getElementById("thoughtInput");
  const thoughtsList = document.getElementById("thoughtsList");

  window.saveThought = function () {
    const text = thoughtInput.value.trim();
    const who = document.getElementById("userSelect").value;
    if (!text) return;
    push(ref(db, "thoughts"), { text, sender: who, timestamp: Date.now() });
    thoughtInput.value = "";
  };

  onChildAdded(ref(db, "thoughts"), (snapshot) => {
    const data = snapshot.val();
    const item = document.createElement("div");
    item.className = "thought-item";
    const who = AVATARS[data.sender] ? data.sender : data.sender;
    item.innerHTML = `<span class="t-sender">${who}:</span>${data.text}<span class="t-time"></span>`;
    item.querySelector(".t-time").textContent = new Date(data.timestamp).toLocaleString();
    thoughtsList.appendChild(item);
    thoughtsList.scrollTop = thoughtsList.scrollHeight;
  });
  // --- end thoughts ---

  const input = document.getElementById("message-input");
  const sendBtn = document.getElementById("sendBtn");

  function sendMessage() {
    const text = input.value.trim();
    if (!text || !myName) return;
    push(ref(db, "messages"), { type: "text", text, sender: myName, timestamp: Date.now() });
    input.value = "";
  }
  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendMessage(); }
  });

  function formatTime(ms) {
    const date = new Date(ms);
    let hours = date.getHours();
    let minutes = date.getMinutes().toString().padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    return `${hours}:${minutes} ${ampm}`;
  }

  onChildAdded(ref(db, "messages"), (snapshot) => {
    const data = snapshot.val();
    const isMe = data.sender === myName;

    const row = document.createElement("div");
    row.className = "message-row " + (isMe ? "sent" : "received");

    const avatarInfo = getAvatar(data.sender);
    const avatar = document.createElement("div");
    avatar.className = "avatar " + avatarInfo.cls;
    avatar.textContent = avatarInfo.emoji;

    const msg = document.createElement("div");
    msg.className = "message";

    const senderLabel = document.createElement("div");
    senderLabel.className = "sender";
    senderLabel.textContent = data.sender;

    let content;
    if (data.type === "gif") {
      content = document.createElement("img");
      content.src = data.url;
      content.className = "gif-message";
    } else {
      content = document.createElement("div");
      content.textContent = data.text;
    }

    const timeLabel = document.createElement("div");
    timeLabel.className = "timestamp";
    timeLabel.textContent = formatTime(data.timestamp);

    msg.appendChild(senderLabel);
    msg.appendChild(content);
    msg.appendChild(timeLabel);

    row.appendChild(avatar);
    row.appendChild(msg);
    chatBox.appendChild(row);

    chatBox.scrollTop = chatBox.scrollHeight;
  });

  // Close GIF panel when clicking outside
  document.addEventListener("click", (e) => {
    const isClickInside = gifPanel.contains(e.target) || gifToggle.contains(e.target);
    if (!isClickInside) gifPanel.style.display = "none";
  });

  const gifPanel = document.getElementById("gif-panel");
  const gifToggle = document.getElementById("gif-toggle");
  const gifSearch = document.getElementById("gif-search");
  const gifResults = document.getElementById("gif-results");

  const GIPHY_KEY = "593h4BgJ8UrK3FBYb4uNZZQRLvtjEF2f";

  gifToggle.addEventListener("click", () => {
    gifPanel.style.display = gifPanel.style.display === "none" ? "block" : "none";
  });

  gifSearch.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
      const q = gifSearch.value.trim();
      if (!q) return;
      const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(q)}&limit=12`);
      const data = await res.json();
      gifResults.innerHTML = "";
      data.data.forEach(gif => {
        const img = document.createElement("img");
        img.src = gif.images.fixed_height_small.url;
        img.addEventListener("click", () => {
          push(ref(db, "messages"), { type: "gif", url: gif.images.original.url, sender: myName, timestamp: Date.now() });
          gifPanel.style.display = "none";
        });
        gifResults.appendChild(img);
      });
    }
  });
</script>
</body>
</html>
