<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K & K chat 💞</title>
<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: #fff;
  }
  header {
    background: rgba(255, 255, 255, 0.05);
    text-align: center;
    padding: 1em;
    font-size: 1.2em;
    color: #7869ffff;
    text-shadow: 0 0 10px #69d5ffff;
  }
  #login {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #111;
  color: #fff;
}

#userSelect {
  padding: 0.8em 1em;
  margin: 0.5em 0;
  border-radius: 25px;
  border: none;
  outline: none;
  background: #222;
  color: #8b80fcff;
  font-size: 1em;
  box-shadow: 0 0 10px rgba(64, 88, 244, 0.4);
  cursor: pointer;
  transition: 0.3s;
}
#userSelect:hover {
  background: #333;
}

#login button {
  display: inline-flex;          
  align-items: center;           
  justify-content: center;      
  padding: 12px 28px;           
  margin-top: 1em;
  min-width: 140px;            
  height: 45px;                
  border-radius: 30px;
  border: none;
  background: linear-gradient(135deg, #7369ffff, #14f3ffff);
  color: #fff;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(138, 105, 255, 0.6);
  transition: all 0.25s ease;
  letter-spacing: 0.5px;
}
#login button:hover {
  transform: translateY(-2px) scale(1.05);
  box-shadow: 0 0 25px rgba(120, 105, 255, 0.9);
}
#login button:active {
  transform: scale(0.97);
  box-shadow: 0 0 10px rgba(133, 105, 255, 0.6);
}

  
  #chat {
    flex: 1;
    display: none;
    flex-direction: column;
  }
  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 1em;
    display: flex;
    flex-direction: column;
    background: #111;
  }
  .message {
    max-width: 70%;
    margin: 0.5em;
    padding: 0.6em 0.8em;
    border-radius: 10px;
    font-size: 0.95em;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 8px rgba(50, 87, 219, 0.3);
  }
  .sent {
    align-self: flex-end;
    background: #222;
    color: #69b9ffff;
  }
  .received {
    align-self: flex-start;
    background: #333;
    color: #fff;
  }
  .sender {
    font-size: 0.75em;
    opacity: 0.7;
    margin-bottom: 0.2em;
  }
  .timestamp {
    font-size: 0.7em;
    opacity: 0.6;
    align-self: flex-end;
    margin-top: 0.3em;
  }
  footer {
    display: flex;
    padding: 0.5em;
    background: rgba(255, 255, 255, 0.05);
  }
  input[type="text"] {
    flex: 1;
    padding: 0.8em;
    border: none;
    border-radius: 20px;
    outline: none;
    font-size: 1em;
    background: #222;
    color: #fff;
  }
  button {
    background: #6978ffff;
    color: white;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    margin-left: 0.5em;
    cursor: pointer;
    font-size: 1.2em;
    box-shadow: 0 0 10px #69cbffff;
  }
</style>
</head>
<body>
<header>K & K chat!💕😘 </header>

<div id="login">
  <label for="userSelect">Choose who you are:</label>
  <select id="userSelect">
    <option value="Kartu">Kartik</option>
    <option value="Kahu">Kahaani</option>
  </select>
 <button class="login button" onclick="enterChat()">Start!</button>
</div>

<div id="chat">
  <div id="chat-box"></div>
  <footer>
    <input type="text" id="message-input" placeholder="Type a message...">
    <button onclick="sendMessage()">➤</button>
    

  </footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } 
    from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

 
const firebaseConfig = {
  apiKey: "AIzaSyBeewPIldcE5h4bP1mAzkk4PLSFY6AjE1c",
  authDomain: "chat-v2626.firebaseapp.com",
  databaseURL: "https://chat-v2626-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "chat-v2626",
  storageBucket: "chat-v2626.firebasestorage.app",
  messagingSenderId: "403392475876",
  appId: "1:403392475876:web:838695d5114c330a08f2f1"
};

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let myName = null;
  const chatBox = document.getElementById("chat-box");

  window.enterChat = function() {
    myName = document.getElementById("userSelect").value;
    document.getElementById("login").style.display = "none";
    document.getElementById("chat").style.display = "flex";
  }

  window.sendMessage = function() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text || !myName) return;
    push(ref(db, "messages"), {
      type: "text",
      text: text,
      sender: myName,
      timestamp: Date.now()
    });
    input.value = "";
  };
  document.getElementById("message-input").addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault(); 
    window.sendMessage();
  }
});

  function formatTime(ms) {
    const date = new Date(ms);
    let hours = date.getHours();
    let minutes = date.getMinutes().toString().padStart(2, "0");
    const ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12 || 12;
    return `${hours}:${minutes} ${ampm}`;
  }

  onChildAdded(ref(db, "messages"), (snapshot) => {
    const data = snapshot.val();
    const msg = document.createElement("div");
    msg.className = "message " + (data.sender === myName ? "sent" : "received");

    const senderLabel = document.createElement("div");
    senderLabel.className = "sender";
    senderLabel.textContent = data.sender;

    const textNode = document.createElement("div");
    textNode.textContent = data.text;

    const timeLabel = document.createElement("div");
    timeLabel.className = "timestamp";
    timeLabel.textContent = formatTime(data.timestamp);

    msg.appendChild(senderLabel);
    msg.appendChild(textNode);
    msg.appendChild(timeLabel);

    chatBox.appendChild(msg);
chatBox.scrollTop = chatBox.scrollHeight;
document.querySelector("footer").scrollIntoView({ behavior: "smooth", block: "end" });

  });
</script>
</body>
</html>
